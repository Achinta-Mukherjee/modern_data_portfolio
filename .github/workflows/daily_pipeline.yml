steps:
  # Step 1: Download your code from your repository onto the server
  - name: Checkout Code
    uses: actions/checkout@v3

  # Step 2: Install Python on the server
  - name: Setup Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  # Step 3: Install all our required libraries
  - name: Install Dependencies
    run: |
      pip install pandas requests pandas-gbq dbt-bigquery

  # Step 4: The Python Extraction (API -> BigQuery)
  # Note: We will add Google Authentication in our next step!
  - name: Run Python Extraction
    run: |
      python 02_api_ingestion/bigquery_load.py

  # Step 5: The dbt Transformation (BigQuery -> BigQuery)
  - name: Run dbt Models
    run: |
      cd modern_data_portfolio
      dbt run --select mart_user_rosters+