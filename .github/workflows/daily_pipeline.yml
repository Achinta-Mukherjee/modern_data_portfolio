name: Daily ELT Pipeline

on:
  schedule:
    # Runs every day at 12.30 AM UTC (6:00 AM IST)
    - cron: '30 0 * * *'
  # This allows you to click a "Run Now" button on GitHub for testing
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    # CRITICAL: These permissions are required for Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      # Step 1: Download your code from your repository onto the server
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Authenticate to Google Cloud (The Magic WIF Step!)
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          # REPLACE the string below with your actual WIF string!
          workload_identity_provider: 'projects/616363217893/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'python-bq-loader@project-f8aca53c-7f41-4c40-968.iam.gserviceaccount.com'

      # Step 3: Install Python on the server
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 4: Install all our required libraries
      - name: Install Dependencies
        run: |
          pip install pandas requests pandas-gbq dbt-bigquery

      # Step 5: The Python Extraction (API -> BigQuery)
      - name: Run Python Extraction
        run: |
          python 02_api_ingestion/bigquery_load.py

      # Step 6: Create dbt profiles.yml dynamically on the server
      - name: Configure dbt Profile
        run: |
          mkdir -p ~/.dbt
          cat << EOF > ~/.dbt/profiles.yml
          modern_data_portfolio:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: project-f8aca53c-7f41-4c40-968
                dataset: raw_data
                threads: 4
                timeout_seconds: 300
                location: US
          EOF

      # Step 7: The dbt Transformation (BigQuery -> BigQuery)
      - name: Run dbt Models
        run: |
          cd modern_data_portfolio
          dbt run